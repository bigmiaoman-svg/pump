<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pump.md · 链上监测台 — 24H 更新</title>
<style>
:root{
  --bg:#0a0d13; --bg2:#0d1119; --card:#10161f; --card2:#0d1320;
  --line:#1d2734; --line2:#2a3a4e; --txt:#e7edf5; --dim:#8fa0b8; --dim2:#5c6c84;
  --gold:#f0b90b; --cyan:#22d3ee; --green:#34d399; --red:#f87171; --purple:#a78bfa;
  --mono:'SF Mono','JetBrains Mono',ui-monospace,Menlo,monospace;
}
/* 亮色主题 */
[data-theme="light"]{
  --bg:#f4f7fb; --bg2:#eef2f8; --card:#ffffff; --card2:#f1f5fa;
  --line:#e2e8f0; --line2:#cbd5e1; --txt:#0f172a; --dim:#475569; --dim2:#94a3b8;
  --gold:#b8860b; --cyan:#0e7490; --green:#059669; --red:#dc2626; --purple:#7c3aed;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--txt);font:14px/1.6 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background-image:radial-gradient(900px 380px at 85% -5%,rgba(34,211,238,.07),transparent),radial-gradient(700px 300px at 5% -5%,rgba(240,185,11,.06),transparent);
  min-height:100vh;
}
[data-theme="light"] body,[data-theme="light"]{
  background-image:radial-gradient(900px 380px at 85% -5%,rgba(14,116,144,.05),transparent),radial-gradient(700px 300px at 5% -5%,rgba(184,134,11,.04),transparent);
}
a{color:var(--cyan);text-decoration:none}
.container{max-width:1180px;margin:0 auto;padding:18px}
.topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:14px 18px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.logo{font-weight:800;font-size:18px;letter-spacing:.5px}
.logo b{color:var(--gold)}
.nav{display:flex;gap:6px;align-items:center}
.nav a{padding:6px 14px;border:1px solid var(--line);border-radius:8px;color:var(--dim);font-size:13px;transition:.2s}
.nav a:hover{color:var(--txt);border-color:var(--line2)}
.nav a.on{color:var(--gold);border-color:var(--line2);background:var(--card2)}
.theme-btn{background:var(--card);border:1px solid var(--line2);color:var(--txt);width:32px;height:32px;border-radius:8px;cursor:pointer;margin-left:6px}
.statusbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:10px 4px;color:var(--dim);font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.badge-24h{background:rgba(240,185,11,.12);color:var(--gold);border:1px solid rgba(240,185,11,.3);padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.mono{font-family:var(--mono);font-size:12px}
/* 总览 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .k{color:var(--dim);font-size:12px}
.stat .v{font-size:24px;font-weight:800;margin-top:2px;font-family:var(--mono)}
.stat .v.gold{color:var(--gold)} .stat .v.green{color:var(--green)} .stat .v.red{color:var(--red)} .stat .v.cyan{color:var(--cyan)}
.stat .s{color:var(--dim2);font-size:11px;margin-top:2px}
/* tabs */
.tabs{display:flex;gap:6px;margin:16px 0 12px}
.tab{padding:8px 18px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--dim);cursor:pointer;font-size:13px;transition:.2s}
.tab:hover{color:var(--txt)}
.tab.on{color:var(--gold);border-color:var(--line2);background:var(--card2)}
.tab .n{font-family:var(--mono);font-size:11px;margin-left:6px;color:var(--dim2)}
/* 币卡 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;transition:.2s}
.card:hover{border-color:var(--line2);transform:translateY(-1px)}
.card-top{display:flex;align-items:center;gap:10px}
.card-top img{width:34px;height:34px;border-radius:9px;background:var(--card2)}
.card-top .nm{font-weight:700;font-size:14px}
.card-top .launch{color:var(--dim2);font-size:11px}
.card-top .rank{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim2)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.metric .k{color:var(--dim2);font-size:11px}
.metric .v{font-size:13px;font-weight:600;font-family:var(--mono)}
.metric .v.gold{color:var(--gold)} .metric .v.green{color:var(--green)} .metric .v.red{color:var(--red)}
.smart-tag{display:inline-block;background:rgba(240,185,11,.1);border:1px solid rgba(240,185,11,.25);color:var(--gold);font-size:11px;padding:2px 8px;border-radius:6px}
.risks{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.risk{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.25);color:var(--red);font-size:11px;padding:2px 8px;border-radius:6px}
.addr{font-family:var(--mono);font-size:10px;color:var(--dim2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:8px}
/* 聪明钱列表 */
.sm-list{display:flex;flex-direction:column;gap:10px}
.sm{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;display:flex;align-items:center;gap:14px}
.sm .sym{font-weight:800;font-size:15px;min-width:110px}
.sm .clu{color:var(--purple);border:1px solid rgba(167,139,250,.35);background:rgba(167,139,250,.1);font-size:11px;padding:2px 8px;border-radius:6px}
.sm .det{display:flex;gap:18px;flex-wrap:wrap;color:var(--dim);font-size:12px}
.sm .det b{color:var(--green);font-family:var(--mono)}
.sm .ts{margin-left:auto;color:var(--dim2);font-size:11px;font-family:var(--mono)}
footer{margin-top:30px;padding:16px 0;border-top:1px solid var(--line);color:var(--dim2);font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media(max-width:640px){.metrics{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <div class="logo">pump<b>.md</b> · 链上监测台</div>
    <div class="nav">
      <a href="https://jinse.md/">jinse.md</a>
      <a href="#" class="on">pump.md</a>
      <a href="https://arb.md/">arb.md</a>
      <a href="https://hunt.md/">hunt.md</a>

/* ===== 主题切换 ===== */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
}
const saved = localStorage.getItem('rd-theme') || 'dark';
applyTheme(saved);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(cur); localStorage.setItem('rd-theme', cur);
});

/* ===== 渲染 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmtTs(ts){
  if(!ts) return '--';
  const d = new Date(ts * 1000);
  const p = n => String(n).padStart(2,'0');
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
